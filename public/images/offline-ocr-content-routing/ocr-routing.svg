<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="OCR routing flow"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="880" height="470" fill="#fafafa"/><text x="30" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">Image-OCR-Index.ps1 (built) and picture recognition (not built)</text><rect x="260" y="50" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="410.0" y="78.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Image file</text><line x1="410" y1="96" x2="410" y2="124" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="420" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">skip if online-only (unless -IncludeCloudOnly)</text><rect x="260" y="126" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="410.0" y="154.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Windows.Media.Ocr reads the text</text><line x1="410" y1="172" x2="410" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="260" y="202" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="410.0" y="230.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Fewer than 5 words?</text><line x1="260" y1="225" x2="150" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="170" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">yes</text><line x1="560" y1="225" x2="670" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="620" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">no</text><rect x="20" y="272" width="260" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="150.0" y="300.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">&quot;Photos (little or no text)&quot;</text><rect x="540" y="272" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="690.0" y="291.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Regex rules, first match wins</text><text x="690.0" y="309.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(Finance\Receipts, Taxes, ...)</text><line x1="690" y1="318" x2="450" y2="368" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="150" y1="318" x2="410" y2="368" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="260" y="370" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="410.0" y="389.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">CSV: suggested folder, words,</text><text x="410.0" y="407.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">text preview. Nothing moved.</text><rect x="20" y="350" width="220" height="66" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="130.0" y="370.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Windows ML + CLIP</text><text x="130.0" y="388.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">labels = PARA folders</text><text x="130.0" y="406.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(not built)</text><line x1="150" y1="318" x2="130" y2="348" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="30" y="450" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Solid = built, tested on three made-up images.  Dashed = proposed, not built.</text></svg>
