<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">The team over one week</title><desc id="d">Bot count over time: 1 at 1:59 AM Saturday, 3 by 6:18 AM, 5 by early Sunday, 7 by 4:33 AM Sunday, 9 at the peak, added over a day or several, then back to 1 (HQ) on October 30.</desc>
<rect width="880" height="420" rx="12" fill="#fbfaf7"/>
<text x="40" y="44" font-size="20" font-weight="600" fill="#1f2328">From one bot to nine and back to one</text>
<line x1="30" y1="330" x2="850" y2="330" stroke="#8c959f" stroke-width="1.5"/>
<rect x="40" y="304" width="90" height="26" rx="6" fill="#0969da" opacity="1"/>
<text x="85" y="294" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">1</text>
<text x="85" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sat Oct 24</text>
<text x="85" y="370" text-anchor="middle" font-size="13" fill="#57606a">1:59 AM</text>
<text x="85" y="392" text-anchor="middle" font-size="12" fill="#57606a">dr eggbot</text>
<rect x="182" y="252" width="90" height="78" rx="6" fill="#0969da" opacity="1"/>
<text x="227" y="242" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">3</text>
<text x="227" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sat Oct 24</text>
<text x="227" y="370" text-anchor="middle" font-size="13" fill="#57606a">6:18 AM</text>
<text x="227" y="392" text-anchor="middle" font-size="12" fill="#57606a">+ Case Notes,</text><text x="227" y="408" text-anchor="middle" font-size="12" fill="#57606a">Bench Tech</text>
<rect x="324" y="200" width="90" height="130" rx="6" fill="#0969da" opacity="1"/>
<text x="369" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">5</text>
<text x="369" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sun Oct 25</text>
<text x="369" y="370" text-anchor="middle" font-size="13" fill="#57606a">early AM</text>
<text x="369" y="392" text-anchor="middle" font-size="12" fill="#57606a">+ QA bot,</text><text x="369" y="408" text-anchor="middle" font-size="12" fill="#57606a">Grok Sparring</text>
<rect x="466" y="148" width="90" height="182" rx="6" fill="#0969da" opacity="1"/>
<text x="511" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">7</text>
<text x="511" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sun Oct 25</text>
<text x="511" y="370" text-anchor="middle" font-size="13" fill="#57606a">4:33 AM</text>
<text x="511" y="392" text-anchor="middle" font-size="12" fill="#57606a">+ Front Desk,</text><text x="511" y="408" text-anchor="middle" font-size="12" fill="#57606a">Stacks</text>
<rect x="608" y="96" width="90" height="234" rx="6" fill="#0969da" opacity="0.85"/>
<text x="653" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">9</text>
<text x="653" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">the peak</text>
<text x="653" y="374" text-anchor="middle" font-size="12" fill="#57606a">+ two more, over</text><text x="653" y="390" text-anchor="middle" font-size="12" fill="#57606a">the next few days</text>
<rect x="750" y="304" width="90" height="26" rx="6" fill="#1a7f37" opacity="1"/>
<text x="795" y="294" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">1</text>
<text x="795" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Fri Oct 30</text>
<text x="795" y="374" text-anchor="middle" font-size="12" fill="#57606a">HQ</text>
</svg>
