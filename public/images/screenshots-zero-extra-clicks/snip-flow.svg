<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-label="Planned screenshot pipeline"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="820" height="500" fill="#fafafa"/><text x="40" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">Screenshot plan from Grok, after two rounds (nothing built yet)</text><rect x="40" y="50" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="78.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Snipping Tool, auto-save on</text><line x1="280.0" y1="96" x2="280.0" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="120" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="148.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Local inbox folder (not synced)</text><line x1="280.0" y1="166" x2="280.0" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="190" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="218.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Watcher reads case.txt (set once per session)</text><line x1="280.0" y1="236" x2="280.0" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="260" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="288.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Rename to YYYYMMDD-HHMMSS_&lt;case&gt;.png</text><line x1="280.0" y1="306" x2="280.0" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="330" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="358.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Move into a synced OneDrive Proofs folder</text><line x1="280.0" y1="376" x2="280.0" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="40" y="400" width="480" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="280.0" y="428.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Drafting bots flag usernames, paths, serials; I glance</text><text x="40" y="480" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">All dashed: planned only. Text evidence (logs, registry values) goes in as code blocks, not images.</text></svg>
