<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Publishing pipeline: repo to site, dev.to and Hashnode"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="900" height="460" fill="#fafafa"/><text x="30" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">One file in, copies out</text><rect x="300" y="50" width="300" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="450.0" y="74.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">content/YYYY-MM-DD-slug.md</text><text x="450.0" y="92.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">in the public GitHub repo</text><line x1="450" y1="106" x2="450" y2="136" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="460" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">merge = Mike&#x27;s approval</text><rect x="300" y="138" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="450.0" y="166.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">GitHub Action</text><line x1="380" y1="184" x2="120" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="184" x2="450" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><line x1="520" y1="184" x2="780" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="20" y="232" width="220" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="130.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Site: Astro on</text><text x="130.0" y="274.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">GitHub Pages (canonical)</text><rect x="340" y="232" width="220" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="450.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">dev.to</text><text x="450.0" y="274.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(never run yet)</text><rect x="660" y="232" width="220" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="770.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Hashnode, Pro plan</text><text x="770.0" y="274.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(never run yet)</text><rect x="340" y="310" width="220" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="450.0" y="338.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">sync-state.json by slug</text><text x="30" y="390" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111">Tier 2, private mirrors: Notion, Linear.  Obsidian: a clone of the entries.</text><text x="30" y="412" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111">Tier 3, drafts I post by hand: X, LinkedIn, Reddit, Facebook, ChatGPT Sites.</text><text x="30" y="440" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Solid = built and run.  Dashed = built in code, never triggered (no entry merged since).</text></svg>
