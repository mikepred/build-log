<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Proposed Notion Handoffs flow"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="880" height="300" fill="#fafafa"/><text x="30" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">Handoffs board (Grok&#x27;s proposal, not built)</text><rect x="30" y="60" width="240" height="70" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="150.0" y="91.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Source agent writes entry</text><text x="150.0" y="109.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(Grok Bot bots, Hermes if set up)</text><rect x="30" y="150" width="240" height="70" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="150.0" y="172.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Microsoft 365 Copilot output</text><text x="150.0" y="190.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">pasted in by me or a bot</text><text x="150.0" y="208.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">(its connector may be read-only)</text><rect x="330" y="90" width="280" height="100" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="470.0" y="118.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Notion: Handoffs</text><text x="470.0" y="136.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">source agent, transcript link,</text><text x="470.0" y="154.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Approval: pending/approved/rejected,</text><text x="470.0" y="172.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">redaction notes, Redacted?</text><line x1="270" y1="95" x2="328" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><line x1="270" y1="185" x2="328" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="660" y="60" width="200" height="60" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="760.0" y="95.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Me: set Approval</text><rect x="660" y="150" width="200" height="70" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="760.0" y="181.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Target agent reads</text><text x="760.0" y="199.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">approved entries only</text><line x1="612" y1="120" x2="658" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><line x1="760" y1="120" x2="760" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="30" y="260" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Caveat from Grok: nothing in Notion or MCP enforces &quot;do not act if Approval = pending.&quot;</text><text x="30" y="280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">The field is a convention. What a bot can actually reach is the real control.</text></svg>
