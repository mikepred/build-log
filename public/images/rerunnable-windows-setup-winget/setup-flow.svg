<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img" aria-label="02-apps.ps1 steps and what is still open"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="880" height="570" fill="#fafafa"/><text x="40" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">02-apps.ps1, in order</text><rect x="40" y="50" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="78.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Restore point (only when elevated)</text><line x1="270.0" y1="96" x2="270.0" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="120" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="148.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Ask the Store to update every app (CIM UpdateScanMethod)</text><line x1="270.0" y1="166" x2="270.0" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="190" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="218.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Wait up to 5 min until App Installer has no update</text><line x1="270.0" y1="236" x2="270.0" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="260" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="288.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">winget downloader = wininet (one-time setting)</text><line x1="270.0" y1="306" x2="270.0" y2="328" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="330" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="358.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">winget source reset (admin only) + source update</text><line x1="270.0" y1="376" x2="270.0" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="400" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="428.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">winget import apps.json (skips what&#x27;s installed)</text><line x1="270.0" y1="446" x2="270.0" y2="468" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="470" width="460" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="270.0" y="498.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Pin listed apps, then winget upgrade --all</text><text x="540" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">Still open</text><rect x="540" y="50" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="690.0" y="69.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">autounattend.xml launches scripts</text><text x="690.0" y="87.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">at first logon</text><line x1="690" y1="96" x2="690" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="540" y="120" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="690.0" y="148.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Master script: tweaks, then apps</text><line x1="690" y1="166" x2="690" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="540" y="190" width="300" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="690.0" y="218.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Clean run on a fresh install</text><text x="540" y="270" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Install mode of 02-apps.ps1 has not had a</text><text x="540" y="286" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">real run yet; its -Check and -Export have.</text><text x="40" y="550" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Solid = built and tested.  Dashed = planned, not built or never run.</text></svg>
