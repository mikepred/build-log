<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Verbs, not a shell</title><desc id="d">Two ways to give an assistant admin. Rejected: anything running as me could use an SSH key stored in my profile, ssh to localhost, and get a fully elevated session that runs any command with no UAC prompt. Built: dr eggbot's non-elevated terminal starts a task under \WinSetup\, the task runs elevated as me only while I'm signed in, and runner.ps1 accepts only five actions and writes a log. From the normal account, writing to the protected folder, editing runner.ps1 and re-registering a task are all denied. Changing the menu means I rerun the installer from an admin window.</desc>
<rect width="880" height="470" rx="12" fill="#fbfaf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text x="40" y="44" font-size="20" font-weight="600" fill="#1f2328">Giving an assistant admin: verbs, not a shell</text>
<g font-size="13" text-anchor="middle">
<text x="40" y="84" text-anchor="start" font-size="14" font-weight="600" fill="#cf222e">Rejected: SSH to localhost</text>
<rect x="40" y="96" width="185" height="84" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="132" y="124" font-weight="600" fill="#1f2328">Anything running as me</text>
<text x="132" y="146" fill="#57606a">a script, a package,</text>
<text x="132" y="164" fill="#57606a">the assistant itself</text>
<rect x="250" y="96" width="185" height="84" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="342" y="124" font-weight="600" fill="#1f2328">Uses the SSH key</text>
<text x="342" y="146" fill="#57606a">the private key sits</text>
<text x="342" y="164" fill="#57606a">in my profile</text>
<rect x="460" y="96" width="185" height="84" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
<text x="552" y="124" font-weight="600" fill="#1f2328">ssh localhost</text>
<text x="552" y="146" fill="#57606a">admin accounts get a</text>
<text x="552" y="164" fill="#57606a">fully elevated session</text>
<rect x="670" y="96" width="170" height="84" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="755" y="124" font-weight="600" fill="#1f2328">Any command as admin</text>
<text x="755" y="146" fill="#57606a">no UAC prompt,</text>
<text x="755" y="164" fill="#57606a">nothing to approve</text>
<text x="40" y="226" text-anchor="start" font-size="14" font-weight="600" fill="#1a7f37">Built: a fixed menu of elevated tasks</text>
<rect x="40" y="238" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="132" y="266" font-weight="600" fill="#1f2328">dr eggbot's terminal</text>
<text x="132" y="288" fill="#57606a">my normal account,</text>
<text x="132" y="306" fill="#57606a">not elevated</text>
<rect x="250" y="238" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="342" y="266" font-weight="600" fill="#1f2328">Start-ScheduledTask</text>
<text x="342" y="288" fill="#57606a">\WinSetup\Check</text>
<text x="342" y="306" fill="#57606a">start: allowed</text>
<rect x="460" y="238" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="552" y="266" font-weight="600" fill="#1f2328">Task runs elevated</text>
<text x="552" y="288" fill="#57606a">as me, only while</text>
<text x="552" y="306" fill="#57606a">I'm signed in</text>
<rect x="670" y="238" width="170" height="84" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="755" y="266" font-weight="600" fill="#1f2328">runner.ps1</text>
<text x="755" y="288" fill="#57606a">5 actions only,</text>
<text x="755" y="306" fill="#57606a">writes a log</text>
<rect x="40" y="360" width="395" height="84" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="237" y="388" font-weight="600" fill="#1f2328">From the normal account: denied</text>
<text x="237" y="410" fill="#57606a">write to the protected folder, edit runner.ps1,</text>
<text x="237" y="428" fill="#57606a">re-register a task with a new definition</text>
<rect x="460" y="360" width="380" height="84" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="650" y="388" font-weight="600" fill="#1f2328">Changing the menu takes me</text>
<text x="650" y="410" fill="#57606a">rerun the installer from an admin window:</text>
<text x="650" y="428" fill="#57606a">that paste is the approval step</text>
</g>
<g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
<line x1="227" y1="138" x2="246" y2="138"/>
<line x1="437" y1="138" x2="456" y2="138"/>
<line x1="647" y1="138" x2="666" y2="138"/>
<line x1="227" y1="280" x2="246" y2="280"/>
<line x1="437" y1="280" x2="456" y2="280"/>
<line x1="647" y1="280" x2="666" y2="280"/>
</g>
<g stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)">
<line x1="132" y1="324" x2="132" y2="356"/>
<line x1="755" y1="356" x2="755" y2="326"/>
</g>
</svg>
