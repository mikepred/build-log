<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Obsidian vault two-layer design"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect width="880" height="370" fill="#fafafa"/><text x="30" y="30" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111" font-weight="bold">Two layers in one vault (design, not built)</text><rect x="30" y="60" width="380" height="120" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="220.0" y="98.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Entries layer</text><text x="220.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">written by Case Notes</text><text x="220.0" y="134.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">same text as the public repo</text><text x="220.0" y="152.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">frontmatter tags, no [[wikilinks]]</text><rect x="470" y="60" width="380" height="120" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="660.0" y="98.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Graph layer (private)</text><text x="660.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">designed and written by Stacks</text><text x="660.0" y="134.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">topic notes, index pages,</text><text x="660.0" y="152.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">links around the entries</text><line x1="470" y1="120" x2="412" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">links point at entries</text><rect x="30" y="240" width="380" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">Public link change? Goes back</text><text x="220.0" y="282.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111">through a pull request</text><line x1="220" y1="180" x2="220" y2="238" stroke="#333" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="30" y="330" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Why no [[wikilinks]] in entries: they show up as broken text on the site and on dev.to.</text><text x="30" y="352" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111">Dashed = proposed only.</text></svg>
