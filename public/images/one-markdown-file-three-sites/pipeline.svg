<line x1="450" y1="332" x2="432" y2="332"/>
<line x1="240" y1="332" x2="222" y2="332" stroke-dasharray="6 4"/>
</g>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
<circle cx="636" cy="194" r="13" fill="#cf222e"/><text x="636" y="199">1</text>
<circle cx="426" cy="194" r="13" fill="#cf222e"/><text x="426" y="199">2</text>
<circle cx="846" cy="304" r="13" fill="#cf222e"/><text x="846" y="309">3</text>
<circle cx="636" cy="304" r="13" fill="#cf222e"/><text x="636" y="309">4</text>
</g>
<g font-size="13" fill="#1f2328">
<text x="30" y="404" font-weight="600">What broke the first time it ran for real (Oct 30–31, 2026)</text>
<text x="30" y="430">1. Site-relative image and link URLs would have broken on dev.to and Hashnode. Fixed in #17.</text>
<text x="30" y="454">2. #17's lockfile came from a newer npm, and npm ci on the runner refused it. Fixed in #18.</text>
<text x="30" y="478">3. Hashnode's old API host redirects to a paid-API notice. Moved to gql-beta in #19.</text>
<text x="30" y="502">4. Hashnode failed and the run still went green. Since #21 a rejected send fails the run.</text>
</g>
</svg>
