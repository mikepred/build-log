<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">How crash evidence survives now</title><desc id="d">Two paths. Blue screen: AutoReboot is off, so the stop code stays on screen for a photo; the crash data waits in the page file; the next successful boot writes MEMORY.DMP and a minidump; a startup task one minute later copies them to C:\CrashVault. Hang with no blue screen: boot logging writes ntbtlog.txt, and the last driver listed is the suspect.</desc>
<rect width="880" height="360" rx="12" fill="#fbfaf7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text x="40" y="44" font-size="20" font-weight="600" fill="#1f2328">Catching the evidence before it disappears</text>
<g font-size="13" text-anchor="middle">
<text x="40" y="84" text-anchor="start" font-size="14" font-weight="600" fill="#cf222e">Blue screen</text>
<rect x="40" y="96" width="185" height="84" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="132" y="124" font-weight="600" fill="#1f2328">Stop code stays up</text>
<text x="132" y="146" fill="#57606a">AutoReboot = 0,</text>
<text x="132" y="164" fill="#57606a">take a phone photo</text>
<rect x="250" y="96" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="342" y="124" font-weight="600" fill="#1f2328">Data in page file</text>
<text x="342" y="146" fill="#57606a">held until the next</text>
<text x="342" y="164" fill="#57606a">successful boot</text>
<rect x="460" y="96" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="552" y="124" font-weight="600" fill="#1f2328">Dump files written</text>
<text x="552" y="146" fill="#57606a">MEMORY.DMP + minidump,</text>
<text x="552" y="164" fill="#57606a">kept even if disk is low</text>
<rect x="670" y="96" width="170" height="84" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="755" y="124" font-weight="600" fill="#1f2328">Copied aside</text>
<text x="755" y="146" fill="#57606a">startup task, +1 min,</text>
<text x="755" y="164" fill="#57606a">to C:\CrashVault</text>
<text x="40" y="238" text-anchor="start" font-size="14" font-weight="600" fill="#9a6700">Hang, no blue screen</text>
<rect x="40" y="250" width="185" height="84" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="132" y="278" font-weight="600" fill="#1f2328">Boot stalls</text>
<text x="132" y="300" fill="#57606a">nothing to photograph</text>
<rect x="250" y="250" width="185" height="84" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="342" y="278" font-weight="600" fill="#1f2328">Boot log</text>
<text x="342" y="300" fill="#57606a">bcdedit bootlog yes writes</text>
<text x="342" y="318" fill="#57606a">C:\Windows\ntbtlog.txt</text>
<rect x="460" y="250" width="185" height="84" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="552" y="278" font-weight="600" fill="#1f2328">Suspect named</text>
<text x="552" y="300" fill="#57606a">the last driver listed</text>
<text x="552" y="318" fill="#57606a">is where to look</text>
</g>
<g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
<line x1="227" y1="138" x2="246" y2="138"/>
<line x1="437" y1="138" x2="456" y2="138"/>
<line x1="647" y1="138" x2="666" y2="138"/>
<line x1="227" y1="292" x2="246" y2="292"/>
<line x1="437" y1="292" x2="456" y2="292"/>
</g>
</svg>
