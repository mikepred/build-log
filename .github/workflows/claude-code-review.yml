name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Multi-Agent Dispatcher
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_STRATEGY: ${{ vars.AGENT_REVIEW_STRATEGY || 'all' }}
          ACTIVE_AGENTS: ${{ vars.ACTIVE_REVIEW_AGENTS || 'claude,antigravity' }}
        run: |
          PR_JSON=$(gh pr view "$PR_NUMBER" --json title,body,labels)
          TITLE=$(echo "$PR_JSON" | jq -r '.title // ""')
          BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          LABELS=$(echo "$PR_JSON" | jq -c '.labels // []')

          node -e "
            import('./scripts/reviewers/dispatcher.mjs').then(({ resolveReviewers }) => {
              const result = resolveReviewers({
                prNumber: process.env.PR_NUMBER,
                labels: JSON.parse(process.env.LABELS || '[]'),
                title: process.env.TITLE,
                body: process.env.BODY,
                strategy: process.env.REVIEW_STRATEGY,
                activeAgents: (process.env.ACTIVE_AGENTS || 'claude,antigravity').split(',')
              });
              const shouldRun = result.selectedAgents.includes('claude');
              console.log('Should Claude run on PR #${PR_NUMBER}:', shouldRun);
              const fs = await import('node:fs');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, \`should_run=\${shouldRun}\n\`);
            });
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title || '' }}
          BODY: ${{ github.event.pull_request.body || '' }}

      - name: Run Claude Code Review
        if: steps.dispatch.outputs.should_run == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor pushes fixes to PR branches, which makes cursor[bot] the run's actor
          allowed_bots: 'cursor'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
